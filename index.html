<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravenshade | Light & Lineage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;400;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; background-color: #1c1917; color: #d6d3d1; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        
        .hero-light-raven { 
            background: linear-gradient(rgba(28,25,23,0.75), rgba(28,25,23,0.75)), 
            url('https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&q=80&w=1920'); 
            background-size: cover; background-position: center; 
        }

        .lang-btn.active { background-color: #f5f5f4; color: #1c1917; }
        .lang-btn { color: #a8a29e; }
        
        .service-card:hover { transform: translateY(-5px); border-color: #57534e; background-color: #292522; }
        
        .gallery-item { overflow: hidden; position: relative; border-radius: 1.5rem; aspect-ratio: 4/5; }
        .gallery-item img { transition: transform 0.8s ease, filter 0.5s ease; width: 100%; height: 100%; object-fit: cover; }
        .gallery-item:hover img { transform: scale(1.05); filter: grayscale(0); }
        
        .ba-label { position: absolute; bottom: 16px; left: 16px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); padding: 5px 12px; border-radius: 6px; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: white; z-index: 10; }
        
        input, textarea { caret-color: white; }
    </style>
</head>
<body class="bg-[#1c1917]">

    <div class="fixed bottom-6 right-6 z-[100] flex bg-black/50 backdrop-blur-md shadow-lg rounded-full p-1 border border-stone-800">
        <button onclick="changeLang('en')" class="lang-btn px-4 py-1 text-[10px] font-bold rounded-full transition" id="btn-en">EN</button>
        <button onclick="changeLang('ro')" class="lang-btn px-4 py-1 text-[10px] font-bold rounded-full transition" id="btn-ro">RO</button>
        <button onclick="changeLang('hu')" class="lang-btn px-4 py-1 text-[10px] font-bold rounded-full transition" id="btn-hu">HU</button>
    </div>

    <nav class="flex justify-between items-center px-8 py-6 bg-[#1c1917]/95 backdrop-blur-sm sticky top-0 z-50 border-b border-stone-800">
        <div class="text-xl font-bold tracking-[0.3em] text-white flex items-center gap-3 italic">
            <i class="fa-solid fa-feather-pointed text-stone-600 rotate-180"></i> RAVENSHADE
        </div>
        <div class="hidden md:flex space-x-10 font-bold text-[9px] uppercase tracking-[0.4em] text-stone-400">
            <a href="#gallery" class="hover:text-white transition" data-en="Portfolio" data-ro="Portofoliu" data-hu="Portfólió">Portfolio</a>
            <a href="#mobile" class="hover:text-white transition" data-en="Remote" data-ro="La Domiciliu" data-hu="Házhoz">Remote</a>
            <a href="#contact" class="hover:text-white transition" data-en="Inquiry" data-ro="Contact" data-hu="Kapcsolat">Inquiry</a>
        </div>
        <a href="https://www.instagram.com/katalin.hairstylist/" target="_blank" class="bg-white text-[#1c1917] px-8 py-2 rounded-full text-[9px] font-bold uppercase tracking-[0.2em] hover:bg-stone-200 transition">Instagram</a>
    </nav>

    <header class="hero-light-raven h-[60vh] flex items-center justify-center text-center px-4">
        <div class="max-w-3xl">
            <h1 class="text-5xl md:text-7xl mb-6 text-white" data-en="Katalin Hairstylist" data-ro="Katalin Hairstylist" data-hu="Katalin Hairstylist">Katalin Hairstylist</h1>
            <p class="text-xs uppercase tracking-[0.6em] text-stone-400" data-en="Artistry in Every Strand" data-ro="Artă în fiecare șuviță" data-hu="Művészet minden hajszálban">Artistry in Every Strand</p>
        </div>
    </header>

    <section id="gallery" class="py-24 bg-[#1c1917] px-6">
        <div class="max-w-6xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="gallery-item">
                    <img src="image_5ceb80.jpg" alt="Work Showcase" class="grayscale">
                    <span class="ba-label" data-en="Result" data-ro="Rezultat" data-hu="Eredmény">Result</span>
                </div>
                <div class="gallery-item">
                    <img src="image_5ceb61.jpg" alt="Before" class="grayscale opacity-50">
                    <span class="ba-label" data-en="Before" data-ro="Înainte" data-hu="Előtte">Before</span>
                </div>
                <div class="gallery-item">
                    <img src="image_5c7095.jpg" alt="Braiding" class="grayscale">
                    <span class="ba-label" data-en="Detail" data-ro="Detaliu" data-hu="Részlet">Detail</span>
                </div>
            </div>
        </div>
    </section>

    <section id="contact" class="py-24 bg-[#292522] px-6 border-t border-stone-800">
        <div class="max-w-xl mx-auto">
            <div class="text-center mb-12">
                <h2 class="text-4xl mb-2 text-white italic" data-en="Send Inquiry" data-ro="Trimite o Cerere" data-hu="Érdeklődés">Send Inquiry</h2>
                <p class="text-stone-500 text-[10px] uppercase tracking-widest" data-en="I will respond as soon as possible" data-ro="Voi răspunde cât mai curând posibil" data-hu="Amint tudok, válaszolok">I will respond as soon as possible</p>
            </div>
            
            <form id="contact-form" action="https://formspree.io/f/mgonalbo" method="POST" class="space-y-4">
                <input type="text" name="name" required 
                    data-placeholder-en="Full Name" data-placeholder-ro="Nume Complet" data-placeholder-hu="Teljes Név"
                    class="w-full bg-[#1c1917] border border-stone-800 rounded-full px-8 py-4 outline-none focus:border-white transition text-sm text-white">
                
                <input type="tel" name="phone" required 
                    data-placeholder-en="Phone Number" data-placeholder-ro="Număr de Telefon" data-placeholder-hu="Telefonszám"
                    class="w-full bg-[#1c1917] border border-stone-800 rounded-full px-8 py-4 outline-none focus:border-white transition text-sm text-white">
                
                <textarea name="message" rows="4" required
                    data-placeholder-en="Your Message or Question" data-placeholder-ro="Mesajul sau Întrebarea ta" data-placeholder-hu="Üzenet vagy Kérdés"
                    class="w-full bg-[#1c1917] border border-stone-800 rounded-3xl px-8 py-4 outline-none focus:border-white transition text-sm text-white resize-none"></textarea>

                <input type="hidden" name="_language_context" id="form-lang-hidden" value="en">

                <button type="submit" id="submit-btn" class="w-full bg-white text-[#1c1917] font-bold py-5 rounded-full hover:bg-stone-200 transition uppercase tracking-[0.3em] text-[10px]" 
                        data-en="Send Message" data-ro="Trimite Mesajul" data-hu="Üzenet Küldése">Send Message</button>
                
                <p id="form-status" class="hidden mt-6 text-center text-xs uppercase tracking-widest text-emerald-500 font-bold"></p>
            </form>
        </div>
    </section>

    <footer class="py-12 bg-[#1c1917] text-center border-t border-stone-900">
        <p class="text-[9px] text-stone-600 uppercase tracking-[0.5em]">Ravenshade — 2026</p>
    </footer>

    <script>
        function changeLang(lang) {
            // Text translation
            document.querySelectorAll('[data-en]').forEach(el => {
                const translation = el.getAttribute('data-' + lang);
                if (translation) el.innerText = translation;
            });

            // Placeholder translation
            document.querySelectorAll('[data-placeholder-en]').forEach(el => {
                const placeholder = el.getAttribute('data-placeholder-' + lang);
                if (placeholder) el.setAttribute('placeholder', placeholder);
            });

            // UI update
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            document.getElementById('form-lang-hidden').value = lang;
            localStorage.setItem('preferredLang', lang);
        }

        const form = document.getElementById("contact-form");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const status = document.getElementById("form-status");
            const btn = document.getElementById("submit-btn");
            const lang = localStorage.getItem('preferredLang') || 'en';
            
            const msgs = {
                en: "Success! Your message was sent.",
                ro: "Succes! Mesajul a fost trimis.",
                hu: "Sikeres! Az üzenetet elküldtük."
            };

            btn.disabled = true;
            btn.style.opacity = "0.5";

            const data = new FormData(e.target);
            fetch(e.target.action, {
                method: 'POST',
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    status.innerText = msgs[lang];
                    status.classList.remove("hidden");
                    form.reset();
                    btn.classList.add("hidden");
                } else {
                    status.innerText = "Error. Please try again.";
                    status.classList.remove("hidden");
                    btn.disabled = false;
                    btn.style.opacity = "1";
                }
            }).catch(() => {
                status.innerText = "Connection error.";
                status.classList.remove("hidden");
                btn.disabled = false;
                btn.style.opacity = "1";
            });
        });

        window.onload = () => changeLang(localStorage.getItem('preferredLang') || 'en');
    </script>
</body>
</html>
