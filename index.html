<section id="contact" class="py-32 bg-[#292522] px-6 border-t border-stone-800">
    <div class="max-w-xl mx-auto text-center">
        <h2 class="text-4xl mb-4 text-white italic" data-en="Connect" data-ro="Conectează-te" data-hu="Kapcsolat">Connect</h2>
        <p class="text-stone-500 text-xs uppercase tracking-[0.4em] mb-12">By appointment only</p>
        
        <form id="contact-form" action="https://formspree.io/f/mgonalbo" method="POST" class="space-y-4 text-left">
            <div>
                <input type="text" name="name" required placeholder="Full Name" 
                    data-placeholder-en="Full Name" data-placeholder-ro="Nume Complet" data-placeholder-hu="Teljes Név"
                    class="w-full bg-[#1c1917] border border-stone-800 rounded-full px-8 py-4 outline-none focus:border-white transition text-sm text-white">
            </div>

            <div>
                <input type="tel" name="phone" required placeholder="Phone Number" 
                    data-placeholder-en="Phone Number" data-placeholder-ro="Număr de Telefon" data-placeholder-hu="Telefonszám"
                    class="w-full bg-[#1c1917] border border-stone-800 rounded-full px-8 py-4 outline-none focus:border-white transition text-sm text-white">
            </div>
            
            <div>
                <textarea name="message" rows="4" placeholder="Your Message or Question" 
                    data-placeholder-en="Your Message or Question" data-placeholder-ro="Mesajul sau Întrebarea ta" data-placeholder-hu="Üzenet vagy Kérdés"
                    class="w-full bg-[#1c1917] border border-stone-800 rounded-3xl px-8 py-4 outline-none focus:border-white transition text-sm text-white resize-none"></textarea>
            </div>

            <input type="hidden" name="_language" id="form-lang-hidden" value="en">

            <button type="submit" id="submit-btn" class="w-full bg-white text-[#1c1917] font-bold py-5 rounded-full hover:bg-stone-200 transition uppercase tracking-[0.3em] text-[10px] mt-4" 
                    data-en="Send Inquiry" data-ro="Trimite Cererea" data-hu="Küldés">Send Inquiry</button>
            
            <p id="form-status" class="hidden mt-6 text-center text-xs uppercase tracking-widest text-emerald-500 font-bold"></p>
        </form>
    </div>
</section>

<script>
    function changeLang(lang) {
        // Translate text content
        document.querySelectorAll('[data-en]').forEach(el => {
            const translation = el.getAttribute('data-' + lang);
            if (translation) el.innerText = translation;
        });

        // Translate placeholders
        document.querySelectorAll('[data-placeholder-en]').forEach(el => {
            const placeholder = el.getAttribute('data-placeholder-' + lang);
            if (placeholder) el.setAttribute('placeholder', placeholder);
        });

        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById('btn-' + lang);
        if (activeBtn) activeBtn.classList.add('active');
        
        document.getElementById('form-lang-hidden').value = lang;
        localStorage.setItem('preferredLang', lang);
    }

    const form = document.getElementById("contact-form");
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const status = document.getElementById("form-status");
        const btn = document.getElementById("submit-btn");
        const lang = localStorage.getItem('preferredLang') || 'en';
        
        const msgs = {
            en: "Success! I'll contact you soon.",
            ro: "Succes! Te voi contacta curând.",
            hu: "Sikeres küldés! Hamarosan kereslek."
        };

        btn.disabled = true;
        btn.innerText = "...";

        const data = new FormData(e.target);
        fetch(e.target.action, {
            method: 'POST',
            body: data,
            headers: { 'Accept': 'application/json' }
        }).then(response => {
            if (response.ok) {
                status.innerText = msgs[lang];
                status.classList.remove("hidden");
                form.reset();
                btn.classList.add("hidden");
            } else {
                status.innerText = "Error. Please try again.";
                status.classList.remove("hidden");
                btn.disabled = false;
                btn.innerText = "Retry";
            }
        }).catch(() => {
            status.innerText = "Network error.";
            status.classList.remove("hidden");
            btn.disabled = false;
        });
    });

    window.onload = () => changeLang(localStorage.getItem('preferredLang') || 'en');
</script>
