<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravenshade | Light & Lineage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; background-color: #1c1917; color: #d6d3d1; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .hero-light-raven { 
            background: linear-gradient(rgba(28,25,23,0.75), rgba(28,25,23,0.75)), 
            url('https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&q=80&w=1920'); 
            background-size: cover; background-position: center; 
        }
        .lang-btn.active { background-color: #f5f5f4; color: #1c1917; }
        .lang-btn { color: #a8a29e; }
        .service-card:hover { transform: translateY(-5px); border-color: #57534e; background-color: #292522; }
        .gallery-item { overflow: hidden; position: relative; border-radius: 1rem; aspect-ratio: 1/1; }
        .gallery-item img { transition: transform 0.8s ease, filter 0.5s ease; width: 100%; height: 100%; object-fit: cover; }
        .gallery-item:hover img { transform: scale(1.05); filter: grayscale(0); }
        .ba-label { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); padding: 4px 10px; border-radius: 4px; font-size: 8px; text-transform: uppercase; letter-spacing: 1px; color: white; z-index: 10; }
        select { -webkit-appearance: none; appearance: none; }
    </style>
</head>
<body class="bg-[#1c1917]">

    <div class="fixed bottom-6 right-6 z-[100] flex bg-black/50 backdrop-blur-md shadow-lg rounded-full p-1 border border-stone-800">
        <button onclick="changeLang('en')" class="lang-btn px-4 py-1 text-[10px] font-bold rounded-full transition" id="btn-en">EN</button>
        <button onclick="changeLang('ro')" class="lang-btn px-4 py-1 text-[10px] font-bold rounded-full transition" id="btn-ro">RO</button>
        <button onclick="changeLang('hu')" class="lang-btn px-4 py-1 text-[10px] font-bold rounded-full transition" id="btn-hu">HU</button>
    </div>

    <nav class="flex justify-between items-center px-8 py-6 bg-[#1c1917]/95 backdrop-blur-sm sticky top-0 z-50 border-b border-stone-800">
        <div class="text-xl font-bold tracking-[0.3em] text-white flex items-center gap-3 italic">
            <i class="fa-solid fa-feather-pointed text-stone-600 rotate-180"></i> RAVENSHADE
        </div>
        <div class="hidden md:flex space-x-10 font-bold text-[9px] uppercase tracking-[0.4em] text-stone-400">
            <a href="#express" class="hover:text-white transition" data-en="Menu" data-ro="Meniul" data-hu="Menü">Menu</a>
            <a href="#gallery" class="hover:text-white transition" data-en="Gallery" data-ro="Galerie" data-hu="Galéria">Gallery</a>
            <a href="#mobile" class="hover:text-white transition" data-en="Remote Service" data-ro="Servicii la Domiciliu" data-hu="Házhoz Menő">Remote Service</a>
            <a href="#contact" class="hover:text-white transition" data-en="Inquiry" data-ro="Cerere" data-hu="Érdeklődés">Inquiry</a>
        </div>
        <a href="https://www.instagram.com/katalin.hairstylist/" target="_blank" class="bg-white text-[#1c1917] px-8 py-2 rounded-full text-[9px] font-bold uppercase tracking-[0.2em] hover:bg-stone-200 transition" 
           data-en="Reserve" data-ro="Rezervă" data-hu="Időpont">Reserve</a>
    </nav>

    <header class="hero-light-raven h-[70vh] flex items-center justify-center text-center px-4">
        <div class="max-w-3xl">
            <span class="text-xs uppercase tracking-[0.5em] text-stone-400 mb-6 block" data-en="Precision in the Shade" data-ro="Precizie în Umbră" data-hu="Precízió az árnyékban">Precision in the Shade</span>
            <h1 class="text-6xl md:text-8xl mb-8 text-white" data-en="Katalin Hairstylist" data-ro="Katalin Hairstylist" data-hu="Katalin Hairstylist">Katalin Hairstylist</h1>
            <a href="#express" class="inline-block border border-white text-white px-12 py-4 rounded-full font-bold transition hover:bg-white hover:text-[#1c1917] uppercase tracking-widest text-[10px]" 
               data-en="Explore the Menu" data-ro="Explorează Meniul" data-hu="Menü Megtekintése">Explore the Menu</a>
        </div>
    </header>

    <section id="gallery" class="py-32 bg-[#1c1917] px-6">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-16">
                <span class="text-xs uppercase tracking-[0.5em] text-stone-500 mb-4 block" data-en="Visual Archive" data-ro="Arhivă Vizuală" data-hu="Vizuális Archívum">Visual Archive</span>
                <h2 class="text-4xl text-white italic" data-en="The Showcase" data-ro="Portofoliu" data-hu="Portfólió">The Showcase</h2>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="gallery-item md:col-span-2 md:row-span-2">
                    <img src="image_5ceb80.jpg" alt="Work 1" class="grayscale">
                    <span class="ba-label" data-en="Featured" data-ro="Recomandat" data-hu="Kiemelt">Featured</span>
                </div>
                <div class="gallery-item">
                    <img src="image_5ceb61.jpg" alt="Work 2" class="grayscale opacity-60">
                    <span class="ba-label" data-en="Before" data-ro="Înainte" data-hu="Előtte">Before</span>
                </div>
                <div class="gallery-item">
                    <img src="image_5c7095.jpg" alt="Work 3" class="grayscale">
                    <span class="ba-label" data-en="Braiding" data-ro="Împletituri" data-hu="Fonás">Braiding</span>
                </div>
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1562322140-8baeececf3df?auto=format&fit=crop&q=80&w=600" alt="Work 4" class="grayscale">
                </div>
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?auto=format&fit=crop&q=80&w=600" alt="Work 5" class="grayscale">
                </div>
            </div>
        </div>
    </section>

    <section id="contact" class="py-32 bg-[#292522] px-6 border-t border-stone-800">
        <div class="max-w-xl mx-auto text-center">
            <h2 class="text-4xl mb-4 text-white italic" data-en="Connect" data-ro="Conectează-te" data-hu="Kapcsolat">Connect</h2>
            <p class="text-stone-500 text-xs uppercase tracking-[0.4em] mb-12">By appointment only</p>
            
            <form id="contact-form" action="https://formspree.io/f/mgonalbo" method="POST" class="space-y-4">
                <input type="text" name="name" required placeholder="Full Name" class="w-full bg-[#1c1917] border border-stone-800 rounded-full px-8 py-4 outline-none focus:border-white transition text-sm text-white">
                <input type="tel" name="phone" required placeholder="Phone Number" class="w-full bg-[#1c1917] border border-stone-800 rounded-full px-8 py-4 outline-none focus:border-white transition text-sm text-white">
                
                <div class="relative">
                    <select name="service" required class="w-full bg-[#1c1917] border border-stone-800 rounded-full px-8 py-4 outline-none focus:border-white transition text-sm text-stone-400 cursor-pointer">
                        <option value="" disabled selected data-en="Select a Service" data-ro="Selectează un serviciu" data-hu="Válasszon szolgáltatást">Select a Service</option>
                        <option value="Cut">Cut / Tuns / Vágás</option>
                        <option value="Color">Color / Vopsit / Festés</option>
                        <option value="Remote">Remote Service / La domiciliu</option>
                    </select>
                </div>

                <input type="hidden" name="_language" id="form-lang-hidden" value="en">

                <button type="submit" id="submit-btn" class="w-full bg-white text-[#1c1917] font-bold py-5 rounded-full hover:bg-stone-200 transition uppercase tracking-[0.3em] text-[10px]" 
                        data-en="Send Inquiry" data-ro="Trimite Cererea" data-hu="Küldés">Send Inquiry</button>
                
                <p id="form-status" class="hidden mt-4 text-xs uppercase tracking-widest text-emerald-500 font-bold"></p>
            </form>
        </div>
    </section>

    <script>
        // Language Switcher Logic
        function changeLang(lang) {
            document.querySelectorAll('[data-en]').forEach(el => {
                const translation = el.getAttribute('data-' + lang);
                if (translation) el.innerText = translation;
            });
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            document.getElementById('form-lang-hidden').value = lang;
            localStorage.setItem('preferredLang', lang);
        }

        // Functional Submit Logic
        const form = document.getElementById("contact-form");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const status = document.getElementById("form-status");
            const btn = document.getElementById("submit-btn");
            const lang = localStorage.getItem('preferredLang') || 'en';
            
            const msgs = {
                en: "Success! I'll contact you soon.",
                ro: "Succes! Te voi contacta curând.",
                hu: "Sikeres küldés! Hamarosan kereslek."
            };

            btn.disabled = true;
            btn.innerText = "...";

            const data = new FormData(e.target);
            fetch(e.target.action, {
                method: 'POST',
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    status.innerText = msgs[lang];
                    status.classList.remove("hidden");
                    form.reset();
                    btn.classList.add("hidden");
                } else {
                    status.innerText = "Error. Please try again.";
                    status.classList.remove("hidden");
                    btn.disabled = false;
                }
            }).catch(() => {
                status.innerText = "Network error.";
                status.classList.remove("hidden");
                btn.disabled = false;
            });
        });

        window.onload = () => changeLang(localStorage.getItem('preferredLang') || 'en');
    </script>
</body>
</html>
